name: 'Verify npm trusted publishing'

# One-time test for INT-2233. Same filename as the real release workflow, because npm
# matches the trusted publisher on the workflow filename, not on the branch.
on:
  workflow_dispatch:

concurrency:
  group: int-2233-oidc-pilot
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/ci/INT-2233-oidc-pilot'
    uses: ./.github/workflows/test.yml
    secrets: inherit

  release:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      # Same command as the prepare step of libs/semantic-release-plugin.
      - name: 'Prepare the beta version'
        run: pnpm -r --include-workspace-root pkg set version=7.5.10-beta-oidc.0

      - uses: ./.github/actions/build

      # No CDN purge: jsDelivr resolves @7 to the newest stable version and skips prereleases.
      # No token in ~/.npmrc: the publish succeeds only through OIDC.
      - name: 'Publish do-shared'
        working-directory: libs/shared
        run: pnpm publish --no-git-checks --tag beta-oidc

      - name: 'Publish delivery-options'
        working-directory: apps/delivery-options
        run: pnpm publish --no-git-checks --tag beta-oidc
