name: 'Build'
description: 'Build the project'

runs:
  using: composite
  steps:
    - name: 'Import translations'
      shell: bash
      # language=bash
      run: |
        pnpm translations:import

    - name: 'Build'
      uses: myparcelnl/actions/nx-run-many@v6
      with:
        target: 'build'
