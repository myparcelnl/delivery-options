version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'build'
      include: 'scope'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    commit-message:
      prefix: 'build'
      include: 'scope'
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 20
    cooldown:
      exclude:
        - '@myparcel/*'
        - '@myparcel-dev/*'
        - '@myparcel-eslint/*'
        - '@myparcel-pdk/*'
    groups:
      minor-js-updates:
        applies-to: version-updates
        exclude-patterns:
          - "@myparcel-pdk/*"
        update-types:
          - "minor"
          - "patch"
      js-pdk:
        patterns:
          - '@myparcel-pdk/*'
